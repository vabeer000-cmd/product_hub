spring.application.name=product-hub

server.port = 8082

spring.datasource.url = jdbc:mysql://localhost:3306/product_hub
spring.datasource.username = root
spring.datasource.password = root

spring.java.hibernate.ddl-auto = validate
spring.jpa.show-sql = true
spring.jpa.properties.hibernate.format_sql = true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

#jwt.secret=my-super-secret-key-that-is-at-least-32-characters-long
#jwt.expiration=10000
jwt.secret=${JWT_SECRET}
jwt.expiration=10000

spring.jpa.open-in-view=false

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId}] %logger{36} - %msg%n

logging.file.name=logs/product-hub.log
logging.pattern.file=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId}] %logger{36} - %msg%n