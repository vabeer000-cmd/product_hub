<h2>Login</h2>

<form (ngSubmit)="login()">

  <div>
    <label>Username</label>
    <input
      type="text"
      name="username"
      [(ngModel)]="loginData.username"
    />
  </div>

  <div>
    <label>Password</label>
    <input
      type="password"
      name="password"
      [(ngModel)]="loginData.password"
    />
  </div>

  <button type="submit">
    Login
  </button>

</form>
